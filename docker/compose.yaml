services:
  app:
    build:
      context: ..
      dockerfile: docker/frankenphp/Dockerfile
      target: frankenphp_dev
    image: leadforge-app:dev                    # ✅ Renommé
    container_name: leadforge_app               # ✅ Renommé
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
      SERVER_NAME: :443
    volumes:
      - ../:/srv/app:cached
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
    ports:
      - "9443:443"                              # ✅ Modifié (8443 → 9443)
      - "9000:80"                               # ✅ Modifié (8000 → 9000)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - leadforge
    tty: true

  db:
    image: postgres:16-alpine
    container_name: leadforge_db                # ✅ Renommé
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadforge}    # ✅ leadForge → leadforge (minuscule)
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"                             # ✅ Modifié (5432 → 5433)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadforge

  redis:
    image: redis:7-alpine
    container_name: leadforge_redis             # ✅ Renommé
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"                             # ✅ Modifié (6379 → 6380)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadforge

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: leadforge_rabbitmq          # ✅ Renommé
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5673:5672"                             # ✅ Modifié (5672 → 5673)
      - "15673:15672"                           # ✅ Modifié (15672 → 15673)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadforge

  mercure:
    image: dunglas/mercure:latest
    container_name: leadforge_mercure           # ✅ Renommé
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:9000 https://localhost:9443    # ✅ Ports modifiés
        anonymous
    ports:
      - "3001:80"                               # ✅ Modifié (3000 → 3001)
    networks:
      - leadforge
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:80/.well-known/mercure" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
    name: leadforge_caddy_data                  # ✅ Nom explicite
  caddy_config:
    name: leadforge_caddy_config                # ✅ Nom explicite
  postgres_data:
    name: leadforge_postgres_data               # ✅ Nom explicite
  redis_data:
    name: leadforge_redis_data                  # ✅ Nom explicite
  rabbitmq_data:
    name: leadforge_rabbitmq_data               # ✅ Nom explicite

networks:
  leadforge:                                    # ✅ Minuscule cohérent
    driver: bridge

